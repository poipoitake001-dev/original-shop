# ============================================================
# Space Card Shop - Docker Compose Production Stack
# Usage:
#   1. Copy .env.production to .env and fill in values
#   2. docker compose up -d
# ============================================================

services:
  # --------------------------------------------------------
  # Service 1: Web Application (Express.js + Built Frontend)
  # --------------------------------------------------------
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: space-card-web
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER:-cardshop}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE:-space_card_shop}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - FRONTEND_URL=${FRONTEND_URL:-https://localhost}
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app-network
    expose:
      - "3000"

  # --------------------------------------------------------
  # Service 2: MySQL Database
  # --------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: space-card-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-space_card_shop}
      MYSQL_USER: ${MYSQL_USER:-cardshop}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --default-authentication-plugin=caching_sha2_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --max-connections=200
      - --innodb-buffer-pool-size=256M
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "${MYSQL_EXTERNAL_PORT:-127.0.0.1:3307}:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # --------------------------------------------------------
  # Service 3: Nginx Reverse Proxy (HTTP/HTTPS)
  # --------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: space-card-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./certbot/www:/var/www/certbot:ro
      - ./certbot/conf:/etc/letsencrypt:ro
    depends_on:
      - web
    networks:
      - app-network

  # --------------------------------------------------------
  # Service 4: Certbot (Let's Encrypt SSL Auto-Renewal)
  # --------------------------------------------------------
  certbot:
    image: certbot/certbot:latest
    container_name: space-card-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done;'"

volumes:
  mysql-data:
    driver: local

networks:
  app-network:
    driver: bridge
